server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Файлы сборки с хешем в имени не меняются — браузер берёт их из кэша без запроса
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location = /favicon.svg {
    expires 7d;
  }

  # Нет такого файла — это адрес страницы приложения; index.html всегда свежий
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}

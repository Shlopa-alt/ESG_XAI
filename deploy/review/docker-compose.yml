# Одноразовый стенд для рецензентов интерфейса: только 127.0.0.1, база в памяти, без секретов,
# без KBRAG, без исполнителя и видеокарты. Не связан с рабочим сервером. См. README.md рядом.
name: esg-review

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: review
      POSTGRES_PASSWORD: review
      POSTGRES_DB: review
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U review -d review"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  backend:
    build: ../../backend
    environment:
      DATABASE_URL: postgresql+psycopg://review:review@postgres:5432/review
      SECRET_KEY: review-stand-only
      AUTH_BACKEND: local
      LOCAL_DEV_PASSWORD: review-stand
      LOCAL_DEV_ROLE: reader
      COOKIE_SECURE: "false"
      KBRAG_URL: http://kbrag-disabled.invalid
      REDIS_URL: redis://redis:6379/0
      ESG_DATA_DIR: /tmp/esg
      KB_INBOX_DIR: /tmp/kb_inbox
    volumes:
      - ./create_users.py:/review/create_users.py:ro
    command: >-
      sh -c "alembic upgrade head && python /review/create_users.py
      && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ../../frontend

  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:5180:80"
    depends_on:
      - backend
      - frontend

  capture:
    profiles: ["tools"]
    build: ./capture
    volumes:
      - ../../.review:/out
    depends_on:
      - proxy
